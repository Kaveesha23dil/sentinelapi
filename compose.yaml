
name: sentinelapi

services:
  democommerce:
    build:
      context: ./demo-services/democommerce
      dockerfile: Dockerfile
    image: sentinelapi/democommerce:local
    container_name: sentinelapi-democommerce
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - sentinelapi-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  sentinelapi-network:
    external: true
    name: sentinelapi-network
