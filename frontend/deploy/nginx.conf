server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location /monitoring-api/ {
        proxy_pass http://monitoring:8001/;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Cache-Control no-store always;
    }
    location /security-api/ {
        proxy_pass http://monitoring:8001/;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Cache-Control no-store always;
    }
    location = /config.js { add_header Cache-Control no-store always; }
    location / { try_files $uri $uri/ /index.html; }
}
